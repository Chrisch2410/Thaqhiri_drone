# Usage (from the repository root). HOST_PLATFORM selects docker/platforms/*.yml:
#   linux   (default) native Linux host; Webots in the container on the host X server.
#   wsl     Windows + Docker Desktop, run from the WSL (Ubuntu) shell; Webots in
#           the container, window through WSLg, GPU through /dev/dxg.
#   windows Windows + Docker Desktop, run from the WSL shell; Webots runs natively
#           on Windows (tools/webots_host/start_webots.cmd), ROS 2 connects over TCP.
#
#   HOST_PLATFORM=wsl docker compose -f docker/docker-compose.sim.yml up -d --build
#   docker compose -f docker/docker-compose.sim.yml exec thaqhiri_sim bash
# ArduPilot SITL is opt-in:
#   docker compose -f docker/docker-compose.sim.yml --profile ardupilot up -d
services:
  ardupilot_sitl:
    profiles: ["ardupilot"]
    build:
      context: .
      dockerfile: Dockerfile.ardupilot_sitl
    image: ardupilot_sitl
    container_name: ardupilot_sitl_dev_env
    working_dir: /home/ubuntu/ros_ws
    command: tail -F anything
    environment:
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=0
    networks:
      - drone_net
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      # ArduPilot workspace checked out next to this repository.
      - ../../ardu_ws:/home/ubuntu/ros_ws
  thaqhiri_sim:
    extends:
      file: platforms/${HOST_PLATFORM:-linux}.yml
      service: platform
    build:
      context: ..
      dockerfile: docker/Dockerfile.sim
    image: thaqhiri_sim
    container_name: thaqhiri_sim_dev_env
    # network_mode: "host"
    networks:
      - drone_net
    privileged: true
    user: "ubuntu"
    working_dir: /home/ubuntu/ros_ws
    tty: true
    stdin_open: true
    command: bash
    environment:
      - ROS_DOMAIN_ID=0
      - QT_X11_NO_MITSHM=1
      - WEBOTS_HOME=/usr/local/webots
      - SITL_UDP_IP=ardupilot_sitl
    volumes:
      - ..:/home/ubuntu/ros_ws
      - webots_config:/home/ubuntu/.config/Cyberbotics

volumes:
  webots_config:

networks:
  drone_net:
    driver: bridge
