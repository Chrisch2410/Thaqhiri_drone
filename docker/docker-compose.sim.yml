# Usage (from the repository root):
#   docker compose -f docker/docker-compose.sim.yml up -d --build
#   docker compose -f docker/docker-compose.sim.yml exec thaqhiri_sim bash
# ArduPilot SITL is opt-in:
#   docker compose -f docker/docker-compose.sim.yml --profile ardupilot up -d
services:
  ardupilot_sitl:
    profiles: ["ardupilot"]
    build:
      context: .
      dockerfile: Dockerfile.ardupilot_sitl
    image: ardupilot_sitl
    container_name: ardupilot_sitl_dev_env
    working_dir: /home/ubuntu/ros_ws
    command: tail -F anything
    environment:
      - ROS_LOCALHOST_ONLY=0
      - ROS_DOMAIN_ID=0
    networks:
      - drone_net
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      # ArduPilot workspace checked out next to this repository.
      - ../../ardu_ws:/home/ubuntu/ros_ws
  thaqhiri_sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sim
    image: thaqhiri_sim
    container_name: thaqhiri_sim_dev_env
    gpus: all
    # network_mode: "host"
    networks:
      - drone_net
    privileged: true
    user: "ubuntu"
    working_dir: /home/ubuntu/ros_ws
    tty: true
    stdin_open: true
    command: bash
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY} # Forward X11 display
      - NVIDIA_DRIVER_CAPABILITIES=all #compute,utility,graphics # Allow GPU access
      - NVIDIA_VISIBLE_DEVICES=all # Expose all GPUs
      - QT_X11_NO_MITSHM=1
      - WEBOTS_HOME=/usr/local/webots
      - SITL_UDP_IP=ardupilot_sitl
    devices:
      - "/dev/dri:/dev/dri" # Allow OpenGL rendering
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ..:/home/ubuntu/ros_ws
      - webots_config:/home/ubuntu/.config/Cyberbotics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu, utility ]

volumes:
  webots_config:

networks:
  drone_net:
    driver: bridge
