# HOST_PLATFORM=windows: Webots runs natively on Windows and ROS 2 in this
# container connects to it over TCP. start_windows.cmd sets this mode, opens
# Webots and runs compose. Same WSLg/GPU setup as wsl.yml for RViz/rtabmap_viz.
services:
  platform:
    extends:
      file: wsl.yml
      service: platform
    environment:
      # Default webots_host for sim_webots/thaqhiri_sim launch files.
      - THAQHIRI_WEBOTS_HOST=host.docker.internal
