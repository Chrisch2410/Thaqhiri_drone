# HOST_PLATFORM=windows: Webots runs natively on Windows
# (tools/webots_host/start_webots.cmd); ROS 2 in this container connects to it
# over TCP. Same WSLg/GPU setup as wsl.yml for RViz/rtabmap_viz windows.
services:
  platform:
    extends:
      file: wsl.yml
      service: platform
    environment:
      # Default webots_host for sim_webots/thaqhiri_sim launch files.
      - THAQHIRI_WEBOTS_HOST=host.docker.internal
