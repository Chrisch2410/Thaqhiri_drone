# HOST_PLATFORM=wsl: Windows + Docker Desktop (WSL2 backend), Webots in the
# container. Run compose from PowerShell, cmd or a WSL shell: WSLg is mounted
# from both places below (only the one matching where compose runs has the
# sockets) and docker/entrypoint.sh links the live one to /tmp/.X11-unix and
# /tmp/wslg. GUI windows appear on the Windows desktop.
services:
  platform:
    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/tmp/wslg/runtime-dir
      - PULSE_SERVER=/tmp/wslg/PulseServer
      # Hardware OpenGL through Mesa's D3D12 driver; without it Mesa falls back
      # to llvmpipe (CPU). Set WSL_GPU_ADAPTER to match another GPU vendor.
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - GALLIUM_DRIVER=d3d12
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=${WSL_GPU_ADAPTER:-NVIDIA}
    devices:
      - "/dev/dxg:/dev/dxg"
    volumes:
      - /run/desktop/mnt/host/wslg:/wslg/desktop   # compose run from Windows
      - /mnt/wslg:/wslg/distro                     # compose run from a WSL shell
      - /usr/lib/wsl:/usr/lib/wsl:ro
